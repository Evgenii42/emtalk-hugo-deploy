baseURL = "https://www.emtalk.org/"
locale = "en"
timeZone = "Europe/Moscow"
title = "EmTalk"
uglyURLs = true
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "section"]
enableRobotsTXT = true
buildDrafts = false
[build]
  noJSConfigInAssets = true
[markup.goldmark.renderer]
  unsafe = false
[module]
  [[module.mounts]]
    source = "static"
    target = "static"
    files = ["! assets/*.css"]
[outputFormats.RouteSitemap]
  mediaType = "application/xml"
  baseName = "sitemap"
  isPlainText = true
  notAlternative = true
[outputs]
  home = ["HTML", "RouteSitemap", "NewsRSS", "PublicResources", "AgentCatalog", "LegacyAgentCatalog", "AgentDiscovery"]
[outputFormats.NewsRSS]
  mediaType = "application/rss+xml"
  baseName = "news/index"
  isPlainText = true
  notAlternative = true
[outputFormats.PublicResources]
  mediaType = "application/json"
  baseName = "ai/resources"
  isPlainText = true
  notAlternative = true
[outputFormats.AgentCatalog]
  mediaType = "application/json"
  baseName = ".well-known/ai-catalog"
  isPlainText = true
  notAlternative = true
[outputFormats.LegacyAgentCatalog]
  mediaType = "application/json"
  baseName = "ai-catalog"
  isPlainText = true
  notAlternative = true
[outputFormats.AgentDiscovery]
  mediaType = "application/json"
  baseName = ".well-known/ard"
  isPlainText = true
  notAlternative = true
