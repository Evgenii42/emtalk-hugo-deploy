baseURL = "https://www.emtalk.org/"
locale = "en"
timeZone = "Europe/Moscow"
title = "EmTalk"
uglyURLs = true
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "section"]
enableRobotsTXT = true
buildDrafts = false
[build]
  noJSConfigInAssets = true
[markup.goldmark.renderer]
  unsafe = false
[module]
  [[module.mounts]]
    source = "static"
    target = "static"
    files = ["! assets/*.css"]
[outputFormats.RouteSitemap]
  mediaType = "application/xml"
  baseName = "sitemap"
  isPlainText = true
  notAlternative = true
[outputs]
  home = ["HTML", "RouteSitemap", "NewsRSS"]
[outputFormats.NewsRSS]
  mediaType = "application/rss+xml"
  baseName = "news/index"
  isPlainText = true
  notAlternative = true
