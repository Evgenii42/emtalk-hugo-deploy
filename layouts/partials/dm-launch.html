{{- $prefix := hugo.Data.render.mountPrefix -}}
<section id="emtalk-main" class="intent-entry" aria-labelledby="dm-launch-title" tabindex="-1">
  <h2 id="dm-launch-title">{{ .title }}</h2>
  <p class="intent-entry__lead">{{ .lead }}</p>
  <div class="intent-entry__actions">{{ range .actions }}<a href="{{ $prefix }}{{ .path }}">{{ .label }}</a>{{ end }}</div>
  <p>AI assistance is available in the app. Coming soon to the website. <a href="https://play.google.com/store/apps/details?id=org.emtalk.dm" target="_blank" rel="noopener noreferrer">Get DM on Google Play</a>. Coming soon to the App Store.</p>
</section>
